# Task runner — https://taskfile.dev  (brew install go-task)
version: "3"

vars:
  PY: .venv/bin/python
  PORT: '{{.PORT | default "8000"}}'

tasks:
  setup:
    desc: Create venv and install dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

  dev:
    desc: Run the app locally with auto-reload (PORT=8001 task dev to override)
    cmds:
      - .venv/bin/uvicorn main:app --reload --port {{.PORT}}

  kill:
    desc: Stop whatever is serving the app port
    silent: true
    cmds:
      - |
        # lsof exits non-zero when nothing matches; that is not an error here.
        pids=$(lsof -ti :{{.PORT}} 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "nothing listening on port {{.PORT}}"
        else
          echo "$pids" | xargs kill
          echo "stopped $(echo "$pids" | wc -w | tr -d ' ') process(es) on port {{.PORT}}"
        fi

  restart:
    desc: Stop the running server and start a fresh one
    cmds:
      - task: kill
      - sleep 1
      - task: dev

  test:
    desc: Run the test suite
    cmds:
      - "{{.PY}} -m pytest tests/ -q"

  test:integration:
    desc: 'Run integration tests against live services (needs vectors:up)'
    cmds:
      - '{{.PY}} -m pytest tests/integration -q -m integration'

  lint:
    desc: Lint the Python source (config in ruff.toml)
    cmds:
      - "{{.PY}} -m ruff check ."

  lint:fix:
    desc: Apply the lint fixes ruff can make automatically
    cmds:
      - "{{.PY}} -m ruff check --fix ."

  web:
    desc: Run the React frontend dev server (needs `task dev` for the API)
    dir: frontend
    cmds:
      - npm install
      - npm run dev

  web:test:
    desc: Run the React component tests
    dir: frontend
    cmds:
      - npm test

  web:build:
    desc: Type-check and build the React frontend
    dir: frontend
    cmds:
      - npm run typecheck
      - npm run build

  check:
    desc: Full verification - lint, compile, validate configs, run tests
    cmds:
      # `ruff check .` parses every Python file in the repo, so it subsumes the
      # py_compile syntax check this used to run against a hardcoded file list —
      # a list that had already drifted (it was missing embeddings.py and
      # vectorstore.py). One less thing to remember to update.
      - task: lint
      - "{{.PY}} -c \"import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/ci.yml', '.github/workflows/integration.yml', '.github/workflows/market-refresh.yml', 'docker-compose.yml']]\""
      - "{{.PY}} -m pytest tests/ -q"

  admin:
    desc: 'Create/promote an admin: ADMIN_USER=you ADMIN_PASS=secret task admin'
    cmds:
      - "{{.PY}} scripts/create_admin.py"

  index:history:
    desc: Rebuild point-in-time S&P 500 membership from index change history
    cmds:
      - "{{.PY}} scripts/build_index_history.py"

  refresh:
    desc: Refresh price data and regenerate the market snapshot
    cmds:
      - "{{.PY}} scripts/refresh_market.py"

  eval:
    desc: Run the RAGAS evaluation (needs GOOGLE_API_KEY)
    cmds:
      # Isolated venv: ragas pins an older langchain stack than the app uses.
      # Derived from the app venv's interpreter so binary wheels resolve.
      - test -d .venv-eval || {{.PY}} -m venv .venv-eval
      - .venv-eval/bin/pip install -q -r eval/requirements-eval.txt
      - .venv-eval/bin/python eval/ragas_eval.py

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t portfolio-decision-tool .

  docker:up:
    desc: Run the app in Docker (http://localhost:8000)
    cmds:
      - docker compose up --build

  deploy:aws:
    desc: Deploy to AWS App Runner (needs aws cli configured)
    cmds:
      - ./deploy/aws-apprunner.sh {{.CLI_ARGS | default "us-west-1"}}

  default:
    desc: List tasks
    cmds:
      - task --list

  eval:history:
    desc: Show recorded evaluation runs as a trend (no API key needed)
    cmds:
      - "{{.PY}} eval/history_report.py {{.CLI_ARGS}}"

  eval:retrieval:
    desc: Score retrieval against the golden set (no API key needed)
    cmds:
      - "{{.PY}} eval/retrieval_eval.py"

  eval:chunking:
    desc: Compare every chunking strategy on the golden set (no API key needed)
    cmds:
      - "{{.PY}} eval/chunking_sweep.py"

  eval:modes:
    desc: Compare bm25 / dense / hybrid retrieval (needs Milvus + vectors:build)
    cmds:
      - "{{.PY}} eval/retrieval_modes.py"

  vectors:up:
    desc: Start the Milvus vector store (etcd + MinIO + Milvus)
    cmds:
      - docker compose --profile vectors up -d
      - 'echo "Milvus starting: cold start takes ~1-2 min. Check with task vectors:status."'

  vectors:down:
    desc: Stop the Milvus vector store
    cmds:
      - docker compose --profile vectors down

  vectors:build:
    desc: Chunk, embed, and load the knowledge base into Milvus
    cmds:
      - "{{.PY}} scripts/build_vectors.py"

  vectors:status:
    desc: Show whether Milvus is reachable and what is indexed
    cmds:
      - "{{.PY}} -c \"import env, json; env.load_env(); import vectorstore; print(json.dumps(vectorstore.stats(), indent=2))\""
