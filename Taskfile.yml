# Task runner — https://taskfile.dev  (brew install go-task)
version: "3"

vars:
  PY: .venv/bin/python
  PORT: '{{.PORT | default "8000"}}'

tasks:
  setup:
    desc: Create venv and install dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

  dev:
    desc: Run the app locally with auto-reload (PORT=8001 task dev to override)
    cmds:
      - .venv/bin/uvicorn main:app --reload --port {{.PORT}}

  kill:
    desc: Stop whatever is serving the app port
    silent: true
    cmds:
      - |
        # lsof exits non-zero when nothing matches; that is not an error here.
        pids=$(lsof -ti :{{.PORT}} 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "nothing listening on port {{.PORT}}"
        else
          echo "$pids" | xargs kill
          echo "stopped $(echo "$pids" | wc -w | tr -d ' ') process(es) on port {{.PORT}}"
        fi

  restart:
    desc: Stop the running server and start a fresh one
    cmds:
      - task: kill
      - sleep 1
      - task: dev

  test:
    desc: Run the test suite
    cmds:
      - "{{.PY}} -m pytest tests/ -q"

  check:
    desc: Full verification - compile, validate configs, run tests
    cmds:
      - "{{.PY}} -m py_compile main.py data.py backtest.py rag.py db.py auth.py scripts/refresh_market.py eval/ragas_eval.py"
      - "{{.PY}} -c \"import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/ci.yml', '.github/workflows/market-refresh.yml', 'docker-compose.yml']]\""
      - "{{.PY}} -m pytest tests/ -q"

  admin:
    desc: 'Create/promote an admin: ADMIN_USER=you ADMIN_PASS=secret task admin'
    cmds:
      - "{{.PY}} scripts/create_admin.py"

  index:history:
    desc: Rebuild point-in-time S&P 500 membership from index change history
    cmds:
      - "{{.PY}} scripts/build_index_history.py"

  refresh:
    desc: Refresh price data and regenerate the market snapshot
    cmds:
      - "{{.PY}} scripts/refresh_market.py"

  eval:
    desc: Run the RAGAS evaluation (needs GOOGLE_API_KEY)
    cmds:
      # Isolated venv: ragas pins an older langchain stack than the app uses.
      # Derived from the app venv's interpreter so binary wheels resolve.
      - test -d .venv-eval || {{.PY}} -m venv .venv-eval
      - .venv-eval/bin/pip install -q -r eval/requirements-eval.txt
      - .venv-eval/bin/python eval/ragas_eval.py

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t portfolio-decision-tool .

  docker:up:
    desc: Run the app in Docker (http://localhost:8000)
    cmds:
      - docker compose up --build

  deploy:aws:
    desc: Deploy to AWS App Runner (needs aws cli configured)
    cmds:
      - ./deploy/aws-apprunner.sh {{.CLI_ARGS | default "us-west-1"}}

  default:
    desc: List tasks
    cmds:
      - task --list

  eval:retrieval:
    desc: Score BM25 retrieval against the golden set (no API key needed)
    cmds:
      - "{{.PY}} eval/retrieval_eval.py"
