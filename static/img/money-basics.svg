<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img"
     aria-label="The common ordering: spend less than you earn, starter emergency fund, employer match, high-interest debt, full emergency fund, then invest">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .ink{fill:#0b0b0b}.sub{fill:#52514e}.muted{fill:#898781}
    .step{fill:#f0f4fb;stroke:#cfe0f6}.num{fill:#2a78d6}
    .last{fill:#eaf6f1;stroke:#c4e6d8}.last-n{fill:#127954}
    .arrow{stroke:#c3c2b7;fill:none}
    @media (prefers-color-scheme:dark){
      .ink{fill:#fff}.sub{fill:#c3c2b7}
      .step{fill:#16273c;stroke:#24405f}.num{fill:#3987e5}
      .last{fill:#0f2a20;stroke:#1b4436}.last-n{fill:#4dbf97}.arrow{stroke:#383835}}
  </style>
  <text class="muted" x="16" y="22" font-size="12">A common ordering — not personal advice</text>
  <g>
    <rect class="step" x="16" y="36" width="212" height="52" rx="10"/>
    <text class="num" x="34" y="60" font-size="13" font-weight="800">1</text>
    <text class="ink" x="54" y="60" font-size="13.5" font-weight="700">Spend less than you earn</text>
    <text class="muted" x="54" y="77" font-size="11.5">Everything else depends on it</text>

    <rect class="step" x="254" y="36" width="212" height="52" rx="10"/>
    <text class="num" x="272" y="60" font-size="13" font-weight="800">2</text>
    <text class="ink" x="292" y="60" font-size="13.5" font-weight="700">Starter emergency fund</text>
    <text class="muted" x="292" y="77" font-size="11.5">~1 month, in an HYSA</text>

    <rect class="step" x="492" y="36" width="212" height="52" rx="10"/>
    <text class="num" x="510" y="60" font-size="13" font-weight="800">3</text>
    <text class="ink" x="530" y="60" font-size="13.5" font-weight="700">Employer 401(k) match</text>
    <text class="muted" x="530" y="77" font-size="11.5">Guaranteed return</text>

    <rect class="step" x="16" y="110" width="212" height="52" rx="10"/>
    <text class="num" x="34" y="134" font-size="13" font-weight="800">4</text>
    <text class="ink" x="54" y="134" font-size="13.5" font-weight="700">High-interest debt</text>
    <text class="muted" x="54" y="151" font-size="11.5">20%+ APY beats investing</text>

    <rect class="step" x="254" y="110" width="212" height="52" rx="10"/>
    <text class="num" x="272" y="134" font-size="13" font-weight="800">5</text>
    <text class="ink" x="292" y="134" font-size="13.5" font-weight="700">Full emergency fund</text>
    <text class="muted" x="292" y="151" font-size="11.5">3–6 months of expenses</text>

    <rect class="last" x="492" y="110" width="212" height="52" rx="10"/>
    <text class="last-n" x="510" y="134" font-size="13" font-weight="800">6</text>
    <text class="ink" x="530" y="134" font-size="13.5" font-weight="700">Invest for the long run</text>
    <text class="muted" x="530" y="151" font-size="11.5">Money you won't touch for years</text>
  </g>
  <path class="arrow" d="M 120 176 L 120 196 L 600 196 L 600 176" stroke-width="1.5"/>
  <text class="muted" x="360" y="218" font-size="12" text-anchor="middle">Automate it · start early · keep costs low · do less</text>
</svg>
