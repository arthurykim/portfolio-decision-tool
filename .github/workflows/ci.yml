name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint runs on its own so a style failure reports separately from a real
  # test failure. Runtime deps aren't needed — ruff parses, it doesn't import.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      # --frozen fails the job if uv.lock is out of date with pyproject.toml.
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-decision-tool .

      # Building only proves the Dockerfile parses. It does not prove the image
      # runs: a module missing from the COPY list builds clean and then dies on
      # `import main`. That exact bug shipped undetected. Boot it and hit a real
      # endpoint.
      - name: Start the container
        run: docker run -d --name pdt -p 8000:8000 portfolio-decision-tool

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs pdt
          exit 1

      # /healthz touches no files. This reads data/, which the image once
      # shipped without — every backtest 500'd on the missing data/cpi.json.
      - name: Check bundled data files
        run: curl -fsS http://localhost:8000/api/index-history > /dev/null

      - name: Container logs (on failure)
        if: failure()
        run: docker logs pdt

      - name: Stop the container
        if: always()
        run: docker rm -f pdt
