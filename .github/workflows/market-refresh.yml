name: market refresh

on:
  schedule:
    # hourly during US market hours (13:00-22:00 UTC covers 9:30-16:00 ET year-round)
    - cron: "15 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_market.py
      - name: commit snapshot if changed
        run: |
          git config user.name "Arthur Kim"
          git config user.email "276535439+arthurykim@users.noreply.github.com"
          git add data/market_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "update market snapshot"
          # Retry: a push landing on main between checkout and push rejects ours.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
