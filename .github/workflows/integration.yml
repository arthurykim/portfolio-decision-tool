name: integration

# Kept out of ci.yml on purpose: this job installs torch, downloads an embedding
# model, and boots Milvus, so it takes minutes where ci.yml takes seconds.
# Keeping it in its own workflow means a slow infrastructure failure reports
# separately from a real unit-test failure.
#
# It runs on EVERY pull request, deliberately. It used to be path-filtered to
# the retrieval files, but the filter cannot see indirect breakage — a change to
# data.py, env.py, or a requirements bump can break the retrieval path without
# touching any file on the list, and that would reach main unchecked. ~3 minutes
# per PR is worth the certainty. If PR volume ever makes that cost real, prefer
# making it a required check that can be skipped by label over reinstating a
# path filter that silently under-tests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  milvus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The model is ~90 MB and never changes for a given EMBED_MODEL, so
      # caching it saves a download on every run.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # Uses the same compose file developers run locally, so CI and `task
      # vectors:up` cannot drift apart.
      - name: Start Milvus
        run: docker compose --profile vectors up -d etcd minio milvus

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Cold start is well over a minute; poll the health endpoint rather than
      # guessing with a fixed sleep.
      - name: Wait for Milvus to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9091/healthz > /dev/null; then
              echo "Milvus ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Milvus did not become healthy in 10 minutes"
          exit 1

      # -m integration alongside the path keeps a miswired marker from silently
      # turning this into a no-op run.
      - name: Run integration tests
        run: pytest tests/integration -v -m integration
        env:
          MILVUS_URI: http://localhost:19530

      - name: Milvus logs (on failure)
        if: failure()
        run: docker compose --profile vectors logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile vectors down -v
