services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - price-cache:/app/cache
      - app-db:/app/db
    environment:
      - CACHE_MAX_AGE=3600
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # Reachable only when the `vectors` profile is up; retrieval falls back to
      # BM25 on its own if it is not, so this is safe to set unconditionally.
      - MILVUS_URI=http://milvus:19530
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-bm25}
    restart: unless-stopped

  # --- Vector store (optional) ------------------------------------------------
  # Behind the `vectors` profile so the default `docker compose up` still starts
  # only the app. Bring the whole stack up with:
  #     docker compose --profile vectors up -d
  # Topology (etcd for metadata, MinIO for object storage, Milvus itself) is the
  # standard standalone deployment from milvus-io/milvus.
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["vectors"]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO deleted minio/minio from Docker Hub in September 2026 when the
  # community edition was archived, which broke every pull — including this
  # project's nightly integration run.
  #
  # Two replacements do NOT work, both verified against CI:
  #   - quay.io/minio/minio (what upstream Milvus still recommends) refuses
  #     anonymous pulls: 401.
  #   - quay.io/minio/aistor/minio pulls fine, but AIStor is licence-gated and
  #     logs "No valid license found ... All S3 operations are denied", so
  #     Milvus fails every bucket check with Access Denied.
  #
  # Bitnami's archived image is the genuine community build with no licence
  # gate. It is frozen, not maintained — see docs/RETRIEVAL.md for the
  # migration note.
  minio:
    image: bitnamilegacy/minio:2025.2.18-debian-12-r0
    profiles: ["vectors"]
    environment:
      # Bitnami uses ROOT_USER/ROOT_PASSWORD; the old ACCESS_KEY/SECRET_KEY
      # pair was deprecated upstream years ago. Values unchanged, and they
      # still match Milvus's defaults.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Milvus creates this itself, but pre-creating it removes a startup race.
      MINIO_DEFAULT_BUCKETS: a-bucket
    volumes:
      - minio-data:/bitnami/minio/data
    # No `command:` — the Bitnami entrypoint configures and starts the server.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.0
    profiles: ["vectors"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      # Milvus takes well over a minute to become ready on a cold start.
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC — what pymilvus connects to
      - "9091:9091"     # metrics / healthz
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  price-cache:
  app-db:
  etcd-data:
  minio-data:
  milvus-data:
