services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - price-cache:/app/cache
      - app-db:/app/db
    environment:
      - CACHE_MAX_AGE=3600
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # Reachable only when the `vectors` profile is up; retrieval falls back to
      # BM25 on its own if it is not, so this is safe to set unconditionally.
      - MILVUS_URI=http://milvus:19530
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-bm25}
    restart: unless-stopped

  # --- Vector store (optional) ------------------------------------------------
  # Behind the `vectors` profile so the default `docker compose up` still starts
  # only the app. Bring it up with:
  #     docker compose --profile vectors up -d
  #
  # One container: Milvus standalone with embedded etcd and local-disk storage
  # (upstream's documented single-node mode, scripts/standalone_embed.sh). This
  # used to be the three-container etcd + MinIO + Milvus topology, until Docker
  # Hub withdrew the minio/minio image in September 2026 and every integration
  # run started failing at `docker compose up`, before a single test ran. The
  # knowledge base is a few hundred vectors on one machine; it never needed a
  # separate metadata server or object store, and each extra third-party image
  # is one more thing that can disappear out from under CI.
  milvus:
    image: milvusdb/milvus:v3.0.0
    profiles: ["vectors"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      # Named differently from the old three-container volume on purpose: that
      # one holds data whose metadata lived in the separate etcd, and starting
      # embedded mode on top of it would read half an index.
      - milvus-standalone-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      # Milvus takes well over a minute to become ready on a cold start.
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC — what pymilvus connects to
      - "9091:9091"     # metrics / healthz
    restart: unless-stopped

volumes:
  price-cache:
  app-db:
  milvus-standalone-data:
